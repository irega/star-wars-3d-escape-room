name: Dev agent on approved

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement (must exist; approved label recommended)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  dev-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'approved' &&
        !contains(github.event.issue.labels.*.name, 'no-agent'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue context
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber =
              context.eventName === 'workflow_dispatch'
                ? Number.parseInt('${{ inputs.issue_number }}', 10)
                : context.payload.issue.number;

            if (!Number.isFinite(issueNumber)) {
              core.setFailed('Invalid issue number');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map((l) =>
              typeof l === 'string' ? l : l.name,
            );
            const isBug = labels.includes('bug');

            core.setOutput('number', String(issueNumber));
            core.setOutput('title', issue.title ?? '');
            core.setOutput('body', issue.body ?? '');
            core.setOutput('url', issue.html_url ?? '');
            core.setOutput('labels', labels.join(', '));
            core.setOutput('is_bug', String(isBug));
            core.setOutput(
              'branch_hint',
              isBug ? `fix/issue-${issueNumber}` : `feat/issue-${issueNumber}`,
            );
            core.setOutput('work_type', isBug ? 'bug fix' : 'feature / plan task');

      - name: Run dev agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          show_full_output: true
          prompt: |
            You are the dev agent for ${{ github.repository }}.

            ## Issue #${{ steps.issue.outputs.number }}
            - Title: ${{ steps.issue.outputs.title }}
            - URL: ${{ steps.issue.outputs.url }}
            - Labels: ${{ steps.issue.outputs.labels }}
            - Work type: ${{ steps.issue.outputs.work_type }}
            - Suggested branch: `${{ steps.issue.outputs.branch_hint }}` (use plan-v2 `feat/*` from the issue **for the branch name only** unless the body lists that work explicitly)

            ### Body (scope authority — implement ONLY this)
            ${{ steps.issue.outputs.body }}

            ## Requirements
            1. **Scope:** The issue Body above is the contract. Sections like "What to implement", "In scope", "Out of scope", and acceptance criteria define the **only** work for this PR. If the issue scope is narrower than a plan-v2 phase (e.g. only Vite init while the branch is `feat/scaffolding`), implement **only** the narrow slice — do not implement the rest of the plan-v2 phase bullet.
            2. Read `docs/plans/plan-v2.md` and `docs/challenge-spec.md` for **conventions, guardrails, and stack** — not as permission to expand scope beyond the issue Body.
            3. Follow TDD (`.claude/skills/tdd/`): red-green-refactor; test behavior via public interfaces.
            4. **If label `bug`:** fix the defect, add regression tests, branch prefix `fix/issue-${{ steps.issue.outputs.number }}`.
            5. **Otherwise (plan task / enhancement):** one vertical slice per the issue Body; branch name may match plan-v2 (e.g. `feat/scaffolding`) without implementing the full phase from the plan.
            6. Open a pull request targeting `main` with `Closes #${{ steps.issue.outputs.number }}` in the body.
            7. Do not merge. Human PR review is required.

            If scope is ambiguous, comment on the issue asking for clarification and stop — do not guess by implementing a full plan-v2 phase. Run `npm run test:ci` and `npm run lint` when you change code.
          claude_args: |
            --max-turns 50
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh:*),Bash(mkdir:*),Bash(touch:*),Bash(chmod:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(echo:*),Bash(rm:*),Bash(mv:*),Bash(cp:*),Bash(sed:*),Bash(grep:*),Bash(which:*),Bash(head:*),Bash(tail:*),Bash(pwd:*)
