name: Dev agent PR feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  pr-feedback:
    env:
      DEV_AGENT_PR_SYSTEM_PROMPT: >-
        You are the dev agent for this repository.

        The reviewer tagged @claude on this pull request.

        Implement only what the review comment requests — do not expand to a full plan-v2 phase.

        If the PR links an issue (Closes #N), do not exceed the linked issue scope unless the comment explicitly asks.

        Follow docs/plans/plan-v2.md and docs/challenge-spec.md for conventions.

        Use TDD (.claude/skills/tdd/).

        Commit and push to this PR branch only. Do not merge.

        Run npm run test:ci and npm run lint when you change code.
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PR feedback
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-haiku-4-5-20251001
          exclude_comments_by_actor: "claude[bot]"
          claude_args: |
            --max-turns 50
            --system-prompt "${{ env.DEV_AGENT_PR_SYSTEM_PROMPT }}"
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh:*)
