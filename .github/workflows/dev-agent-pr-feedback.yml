name: Dev agent PR feedback

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-feedback:
    env:
      DEV_AGENT_PR_SYSTEM_PROMPT: >-
        You are the dev agent for this repository.

        The reviewer tagged @claude on this pull request.

        Implement only what the review comment requests — do not expand beyond the linked issue scope.

        If the PR links an issue (Closes #N), do not exceed the linked issue scope unless the comment explicitly asks.

        Follow docs/tech-design.md and docs/challenge-spec.md for conventions.

        Use TDD (.claude/skills/tdd/).

        Commit and push to this PR branch only. Do not merge.

        Run npm run test:ci and npm run lint when you change code.

        When updating a PR description, follow `.github/pull_request_template.md` (What, How, Testing, Checklist).
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate trigger conditions
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const payload = context.payload;
            const body = payload.comment?.body ?? payload.review?.body ?? '';
            const userType = payload.comment?.user?.type ?? payload.review?.user?.type ?? '';
            const hasPR = Boolean(payload.issue?.pull_request || payload.pull_request);
            const isHuman = userType !== 'Bot';
            const hasMention = /(^|\s)@claude\b/i.test(body);
            const shouldRun = hasPR && isHuman && hasMention;

            core.info(
              JSON.stringify(
                {
                  eventName: context.eventName,
                  action: payload.action,
                  hasPR,
                  userType,
                  hasMention,
                  shouldRun,
                  bodyPreview: body.slice(0, 140),
                },
                null,
                2,
              ),
            );

            core.setOutput('should_run', String(shouldRun));

      - name: Skip (no @claude trigger)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Skipping: no valid @claude mention from a human on a PR event."

      - name: Checkout repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply PR feedback
        if: steps.gate.outputs.should_run == 'true'
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: "true"
          exclude_comments_by_actor: "claude[bot]"
          claude_args: |
            --model claude-haiku-4-5-20251001
            --max-turns 50
            --system-prompt "${{ env.DEV_AGENT_PR_SYSTEM_PROMPT }}"
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)
