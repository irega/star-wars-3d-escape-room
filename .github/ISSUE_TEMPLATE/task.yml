name: Plan task (dev agent)
description: Feature or phase work from plan-v2 — not a bug
title: "feat(scope): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Agent pickup:** add label `approved` when this is ready (Actions → Dev agent on approved).
        Manual run: Actions → Dev agent on approved → Run workflow → issue number.

        Use the **Bug report** template and label `bug` only for defects.

        **Branch dropdown** = naming hint only. It does **not** mean "implement the entire plan-v2 phase" — define the real slice under **What to implement** (and Out of scope if needed).
  - type: dropdown
    id: plan_branch
    attributes:
      label: Branch name hint (plan-v2)
      options:
        - feat/scaffolding
        - feat/ci-cd
        - feat/stores
        - feat/i18n
        - feat/ui-overlays
        - feat/interactive-components
        - feat/scene-detention-cell
        - feat/scene-control-room
        - feat/scene-corridor
        - feat/scene-hangar-bay
        - feat/game-flow
        - feat/performance
        - feat/e2e-tests
        - feat/readme
        - other (describe below)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What to implement (in scope)
      description: Concrete slice for one PR — small enough to review in under an hour. This is what the dev agent will build.
      placeholder: e.g. Vite + React + TS scaffold only (no R3F/Husky yet)
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope (optional)
      description: Explicitly exclude plan-v2 items you are NOT asking for in this issue
      placeholder: e.g. R3F, drei, Husky, empty room scene — defer to follow-up issues
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Unit tests pass\n- [ ] Matches challenge-spec guardrails"
    validations:
      required: true
